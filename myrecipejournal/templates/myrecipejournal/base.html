<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Recipe Journal{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="{% static 'myrecipejournal/css/base.css' %}">
</head>

<body class="d-flex flex-column min-vh-100">

    <header class="site-header">
        <div class="site-header-inner">
            
                <a href="{% url 'recipe_list' %}" class="site-title">
                    Lemon Drizzle
                </a>
        
        </div>
    </header>

    <nav class="navbar custom-nav">
        <div class="container nav-inner">
                <div class="nav-links">
                    <a href="{% url 'recipe_create' %}">+ Add a recipe</a>
                    <a href="{% url 'my_recipes' %}">My recipes</a>
                    <a href="{% url 'about' %}">About</a>
                    
                    <a href="{%url 'profile' %}">Profile</a>
                    

                    {% if logged_in %}
                        <a href="{% url 'logout' %}" >Log out</a>
                    {% else %}
                        <a href="{% url 'login' %}" >Log in</a>
                    {% endif %}

                </div>
            
        </div>
    </nav>


    <main class="page-container">
        {% block content %}{% endblock %}
    </main>

    <footer class="custom-footer">
        <p>&copy; {{ now|date:"Y" }} lemondrizzle</p>
    </footer>

</body>
</html>
