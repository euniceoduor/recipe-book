{% extends './base.html' %}
{% block title %}Delete Recipe{% endblock %}

{% block content %}

<div class="recipe-container">


    <h1>Delete Recipe</h1>
    <p>Are you sure you want to delete the recipe for  "<strong>{{ recipe.title }}</strong>"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Yes, delete</button>
        <a href="{% url 'recipe_view' recipe.pk %}" class="btn btn-secondary">Cancel</a>
    </form>

</div>
{% endblock %}
